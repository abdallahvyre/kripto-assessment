[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kripto-assessment"
version = "1.0.0rc1"
description = "Modular CLI for authorized web application security assessments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Abdallah Al-Balushi", email = "abdallahm129923@gmail.com" },
]
dependencies = [
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "rich>=13,<15",
  "prompt_toolkit>=3.0.48,<4",
  "dnspython>=2.4,<3",
  "python-whois>=0.9.4,<1",
  "idna>=3.6,<4",
  "PySocks>=1.7.1,<2",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
reports = [
  "reportlab>=4.2,<5",
  "arabic-reshaper>=3,<4",
  "python-bidi>=0.6,<1",
]
browser = ["playwright>=1.48,<2"]
selenium = ["selenium>=4.25,<5"]

[project.scripts]
kripto = "main:main"

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["core", "core.*"]

[tool.setuptools.package-data]
core = ["fsociety.ascii"]
